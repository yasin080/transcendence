name: transcendence

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    UID: ${UID:-1000}
    GID: ${GID:-1000}

x-php-common: &php-common
  env_file: .env
  volumes:
    - ./backend:/var/www/html
    - ./backups:/var/www/backups:ro
  networks: [transcendence]
  restart: unless-stopped
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-1443}:443"
    environment:
      NGINX_MODE: ${NGINX_MODE:-dev}
      HTTPS_PORT: ${HTTPS_PORT:-1443}
    volumes:
      - ./frontend/dist:/var/www/frontend:ro
      - certs:/etc/nginx/certs
    networks: [transcendence]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Run as the (host-aligned) node user so nothing Vite writes into the
    # bind mount or the node_modules volume ends up owned by root.
    user: root
    env_file: .env
    volumes:
      - ./frontend:/app
      # Named volume so the container's node_modules (linux binaries) never
      # collide with whatever the host may have installed.
      - frontend_node_modules:/app/node_modules
    networks: [transcendence]
    restart: unless-stopped

  php:
    build: *php-build
    <<: *php-common
    environment:
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      # On a clean clone the entrypoint runs composer install, migrations and
      # seeders before php-fpm listens; a slow machine needs more than 60 s.
      start_period: 180s

  reverb:
    build: *php-build
    <<: *php-common
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      php:
        condition: service_healthy

  queue:
    build: *php-build
    <<: *php-common
    command: php artisan queue:work --tries=3 --timeout=90
    depends_on:
      php:
        condition: service_healthy

  gameloop:
    build: *php-build
    <<: *php-common
    command: php artisan game:tick
    depends_on:
      php:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks: [transcendence]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Dumps the database every 6 hours into ./backups (newest 28 kept, one week).
  # It starts after php, so the first dump already has the migrated schema.
  backup:
    image: mariadb:11.4
    user: root
    env_file: .env
    environment:
      BACKUP_KEEP: 28
    command: sh -c 'while true; do /scripts/backup.sh; sleep 21600; done'
    volumes:
      # The folder, not the file: git replaces the file on checkout and a
      # single-file mount would keep pointing at the deleted one.
      - ./docker/backup:/scripts:ro
      - ./backups:/backups
    networks: [transcendence]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [transcendence]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  transcendence:
    driver: bridge

volumes:
  db_data:
  redis_data:
  certs:
  frontend_node_modules:
