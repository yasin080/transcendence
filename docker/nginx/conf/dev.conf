server {
    listen      80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl default_server;
    http2       on;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Resolving upstreams at request time (instead of at
    # startup) means nginx boots even if a backend container is still starting.
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 20M;

    include /etc/nginx/snippets/backend.conf;

    # Vite dev server. The upgrade headers are what makes HMR work through TLS.
    location / {
        set                $frontend_upstream http://frontend:5173;
        proxy_pass         $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
