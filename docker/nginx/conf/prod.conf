server {
    listen      80 default_server;
    server_name _;
    # HTTPS_PORT is the port published on the host; the entrypoint fills it in
    return 301 https://$host:HTTPS_PORT$request_uri;
}

server {
    listen      443 ssl default_server;
    http2       on;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=30s;

    client_max_body_size 20M;

    include /etc/nginx/snippets/backend.conf;

    # Static build produced by `npm run build`.
    root  /var/www/frontend;
    index index.html;

    # Hashed assets can be cached hard; index.html must never be.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: without this, refreshing on any client-side route 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
