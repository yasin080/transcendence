add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff"                            always;
add_header X-Frame-Options           "SAMEORIGIN"                         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# A Content-Security-Policy belongs here too, but it has to be written against
# the real asset pipeline (WebGL, workers, wasm) or it silently breaks the
# game. Add it once the 3D renderer is in place — see docs/plan.md.
