# Laravel — FastCGI straight to php-fpm.
# nginx does not need the application source mounted: php-fpm resolves
# SCRIPT_FILENAME inside its own container.
location ^~ /api/ {
    include       fastcgi_params;
    set           $php_upstream php:9000;
    fastcgi_pass  $php_upstream;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
    fastcgi_param HTTPS           on;
    fastcgi_read_timeout          60s;
}

# Sanctum's CSRF cookie endpoint, used by the SPA before logging in.
location ^~ /sanctum/ {
    include       fastcgi_params;
    set           $php_upstream php:9000;
    fastcgi_pass  $php_upstream;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
    fastcgi_param HTTPS           on;
}

# Reverb (WebSocket). /app/{key} is the client socket, /apps/{id}/events is
# the HTTP endpoint Laravel uses to publish.
location ~ ^/(app|apps)(/|$) {
    set                $reverb_upstream http://reverb:8080;
    proxy_pass         $reverb_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
